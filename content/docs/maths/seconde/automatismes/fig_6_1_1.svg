
  <svg xmlns="http://www.w3.org/2000/svg" width="400" height="320" viewBox="0 0 400 320">

    <!-- Fond -->
    <rect width="100%" height="100%" fill="white" />

    <!-- Axes -->
    <line x1="50" y1="270" x2="350" y2="270" stroke="black" stroke-width="2" />
    <line x1="50" y1="270" x2="50" y2="20" stroke="black" stroke-width="2" />

    <!-- Graduations X -->
    <g font-size="12" text-anchor="middle">
      <line x1="110" y1="270" x2="110" y2="275" stroke="black" />
      <text x="110" y="292">1</text>

      <line x1="170" y1="270" x2="170" y2="275" stroke="black" />
      <text x="170" y="292">2</text>

      <line x1="230" y1="270" x2="230" y2="275" stroke="black" />
      <text x="230" y="292">3</text>

      <line x1="290" y1="270" x2="290" y2="275" stroke="black" />
      <text x="290" y="292">4</text>

      <line x1="350" y1="270" x2="350" y2="275" stroke="black" />
      <text x="350" y="292">5</text>
    </g>

    <!-- Graduations Y -->
    <g font-size="12" text-anchor="end">
      <line x1="45" y1="220" x2="50" y2="220" stroke="black" />
      <text x="40" y="224">1</text>

      <line x1="45" y1="170" x2="50" y2="170" stroke="black" />
      <text x="40" y="174">2</text>

      <line x1="45" y1="120" x2="50" y2="120" stroke="black" />
      <text x="40" y="124">3</text>

      <line x1="45" y1="70" x2="50" y2="70" stroke="black" />
      <text x="40" y="74">4</text>

      <line x1="45" y1="20" x2="50" y2="20" stroke="black" />
      <text x="40" y="24">5</text>
    </g>

    <!-- Barres -->
    <rect x="90" y="220" width="40" height="50" fill="steelblue" stroke="black" />
    <rect x="150" y="70" width="40" height="200" fill="steelblue" stroke="black" />
    <rect x="210" y="120" width="40" height="150" fill="steelblue" stroke="black" />
    <rect x="270" y="170" width="40" height="100" fill="steelblue" stroke="black" />

  </svg>
