<!doctype html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <title>Éditeur Markdown + LaTeX</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 800px;
      margin: 20px auto;
      padding: 0 15px;
    }

    h1 {
      color: #333;
      border-bottom: 2px solid #eee;
      padding-bottom: 10px;
    }

    #editor {
      width: 100%;
      height: 300px;
      font-family: 'Courier New', monospace;
      font-size: 14px;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
      margin-bottom: 10px;
    }

    #output {
      margin-top: 20px;
      padding: 15px;
      border: 1px solid #ccc;
      border-radius: 4px;
      background: white;
      min-height: 100px;
    }

    button {
      padding: 10px 20px;
      margin: 5px;
      cursor: pointer;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 14px;
    }

    button:hover {
      background: #0056b3;
    }

    button#edit {
      background: #6c757d;
    }

    button#edit:hover {
      background: #545b62;
    }

    .katex-error {
      color: #dc3545;
      border: 1px dashed #dc3545;
      padding: 2px 4px;
      background: #fff5f5;
      font-family: monospace;
    }

    .error {
      color: #dc3545;
      padding: 10px;
      background: #fff5f5;
      border: 1px solid #dc3545;
      border-radius: 4px;
    }

    .instructions {
      background: #f8f9fa;
      padding: 15px;
      border-radius: 4px;
      margin-bottom: 20px;
      border-left: 4px solid #007bff;
    }

    .instructions h2 {
      margin-top: 0;
      color: #007bff;
    }

    .instructions ul {
      margin-bottom: 0;
    }
  </style>
</head>

<body>
  <h1>Éditeur Markdown + LaTeX</h1>

  <div class="instructions">
    <h2>Comment utiliser</h2>
    <ul>
      <li>Écrivez votre contenu en <strong>Markdown</strong> (titres, listes, liens, etc.)</li>
      <li>Ajoutez des formules LaTeX entre <code>$$...$$</code> (affichage) ou <code>$...$</code> (inline)</li>
      <li>Cliquez sur <strong>Compiler</strong> pour voir le rendu</li>
      <li>Cliquez sur <strong>Éditer</strong> pour revenir au code</li>
    </ul>
  </div>

  <textarea id="editor" placeholder="# Devoir de maths

Voici une équation :
$$ \dfrac{1}{2} \begin{array}{cc} a & b \\ c & d \end{array} $$

Une liste :
- Exercice 1
- Exercice 2

Du texte en *italique* et du **gras**.

Une formule inline : $E = mc^2$"></textarea>
  <br>
  <button id="compile">Compiler</button>
  <button id="edit" style="display: none;">Éditer</button>
  <div id="output" style="display: none;"></div>

  <script src="https://cdn.jsdelivr.net/npm/marked@4.2.12/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>
  <script>
    // Désactiver l'échappement des caractères spéciaux dans marked
    marked.setOptions({sanitize: false});

    const editor = document.getElementById("editor");
    const output = document.getElementById("output");
    const compileBtn = document.getElementById("compile");
    const editBtn = document.getElementById("edit");

    let sourceCode = editor.value;

    // Sauvegarder le code source à chaque modification
    editor.addEventListener("input", () => {
      sourceCode = editor.value;
    });

    function compile() {
      try {
        // Parser le Markdown en HTML
        const html = marked.parse(editor.value);

        // Insérer le HTML dans la zone de rendu
        output.innerHTML = html;

        // Configurer et exécuter KaTeX pour rendre les formules
        renderMathInElement(output, {
          delimiters: [
            {left: "$$", right: "$$", display: true},
            {left: "$", right: "$", display: false},
            {left: "\\\(", right: "\\\)", display: false},
            {left: "\\\[", right: "\\\]", display: true}
          ],
          // Gestion des erreurs LaTeX
          errorCallback: (math, error) => {
            const safeError = error.replace(/"/g, "&quot;");
            const errorHTML = `<span class="katex-error" title="${safeError}">${math}</span>`;
            // Remplacer la formule erronée dans le contenu
            output.innerHTML = output.innerHTML.replace(math, errorHTML);
            return errorHTML;
          },
          // Options de rendu KaTeX
          macros: {},
          trust: false
        });

        // Basculer l'affichage : cacher l'éditeur, afficher le rendu
        editor.style.display = "none";
        compileBtn.style.display = "none";
        output.style.display = "block";
        editBtn.style.display = "inline-block";

      } catch (e) {
        // Afficher les erreurs de parsing Markdown
        output.innerHTML = `<div class="error">Erreur Markdown : ${e.message}</div>`;
        output.style.display = "block";
      }
    }

    function showEditor() {
      // Réafficher l'éditeur avec le code source
      editor.value = sourceCode;
      editor.style.display = "block";
      compileBtn.style.display = "inline-block";
      output.style.display = "none";
      editBtn.style.display = "none";
    }

    // Écouteurs d'événements
    compileBtn.addEventListener("click", compile);
    editBtn.addEventListener("click", showEditor);
  </script>
</body>

</html>
